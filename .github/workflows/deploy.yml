# Deploys CONTOUR (the game and its room server) to Cloudflare, then checks
# the live site: the page is this commit's, and its rooms judge as they should.
#
# Runs on every push to the working branch (and by hand with "Run workflow",
# once this file is on the default branch) — but not for a push that only
# changes the Markdown notes: nothing served changes, and a deploy moves every
# room in play to a fresh copy of the code (a moment of RECONNECTING… for
# whoever is playing). It needs two repository secrets —
# see SETUP.md:
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account to deploy to
# Until they are set it does nothing (and does not fail).
name: Deploy to Cloudflare
on:
  push:
    branches: [claude/multiplayer-login-c9n7dk]
    paths-ignore: ['**.md']
  workflow_dispatch:
# one deploy at a time, each checked before the next goes out
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Not set up yet
        if: env.READY != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; nothing to deploy (see SETUP.md)."
      - uses: actions/checkout@v6
        if: env.READY == 'true'
      - name: Test the room server
        if: env.READY == 'true'
        run: npm ci && npm run test:server
      - name: Deploy
        id: deploy
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live site
        if: env.READY == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          OUT: ${{ steps.deploy.outputs.command-output }}
        run: |
          [ -n "$URL" ] || URL=$(printf '%s' "$OUT" | grep -o 'https://[^ ]*\.workers\.dev' | head -n 1)
          [ -n "$URL" ] || { echo "The deployed URL is not in wrangler's output."; exit 1; }
          echo "### 公開先: $URL" >> "$GITHUB_STEP_SUMMARY"
          # the version just deployed: the check waits for rooms running it
          # (a push that changes nothing of the server keeps the build's
          # fingerprint, and rooms still moving over would pass for new ones)
          VER=$(printf '%s' "$OUT" | grep -o 'Current Version ID: [0-9a-f-]*' | head -n 1 | awk '{print $4}')
          LIVE_URL="$URL" LIVE_VERSION="$VER" node server/test/room.test.js
